# Informa ao Spring o endereço JDBC do banco PostgreSQL.
# Porta, banco, usuário e senha são os mesmos do docker-compose.yml: mudou lá, mude aqui.
spring.datasource.url=jdbc:postgresql://localhost:5437/docas
# Informa o usuário usado para abrir a conexão com o banco.
spring.datasource.username=docas
# Informa a senha usada para abrir a conexão com o banco.
spring.datasource.password=docas

# Pede ao Hibernate apenas para validar o schema, sem criar ou alterar tabelas.
# Quem cria as tabelas são as migrations em src/main/resources/db/migration.
spring.jpa.hibernate.ddl-auto=validate
# Mostra no console o SQL que o Repository dispara por meio do Hibernate.
spring.jpa.show-sql=true
# Evita manter uma sessão JPA aberta durante toda a requisição web.
spring.jpa.open-in-view=false

# Liga a execução automática das migrations no startup da aplicação.
spring.flyway.enabled=true

# ---------------------------------------------------------------- Swagger (Aula 09)
# Endereço do contrato OpenAPI em JSON -- é este arquivo que o Postman importa.
springdoc.api-docs.path=/v3/api-docs
# Endereço da página do Swagger UI (redireciona para /swagger-ui/index.html).
springdoc.swagger-ui.path=/swagger-ui.html
# Sem esta linha, o Swagger mostra as respostas como "*/*"; a API só devolve JSON.
springdoc.default-produces-media-type=application/json
# Abre cada endpoint já no modo "Try it out", pronto para enviar a requisição.
springdoc.swagger-ui.try-it-out-enabled=true
# Ordena os grupos (tags) e, dentro deles, os endpoints pelo método HTTP.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# ---------------------------------------------------------------- Observabilidade (Aula 13, carta C2)
# Dá um nome à aplicação (aparece nos logs e nas métricas).
spring.application.name=agenda-docas
# Quais endpoints do Actuator ficam expostos pela web. O padrão é só "health".
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Mostra os detalhes do /actuator/health (banco, disco) e não só "UP".
management.endpoint.health.show-details=always
# Etiqueta toda métrica com o nome da aplicação (para filtrar no Prometheus/Grafana).
management.metrics.tags.application=agenda-docas
# Gera histograma por rota HTTP, para calcular percentis de latência (p95, p99).
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logs no CONSOLE: legíveis para gente. Cada linha carrega o id da requisição
# (veja RequisicaoIdFilter), para seguir uma requisição pelos logs do começo ao fim.
logging.pattern.level=%5p [%X{requisicaoId:-}]
# Logs no ARQUIVO: estruturados, uma linha JSON por evento no formato ECS (Elastic
# Common Schema). Cada campo (operacao, docaId, regra, requisicaoId...) vira uma
# chave do JSON, pronta para ser filtrada no Kibana, Grafana/Loki ou com jq.
logging.file.name=logs/agenda-docas.log
logging.structured.format.file=ecs
# Nível dos logs do nosso código (pacote api). INFO mostra criar/alterar/excluir.
logging.level.api=INFO
